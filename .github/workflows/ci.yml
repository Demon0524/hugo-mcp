name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m py_compile server.py scripts/generate_tools_docs.py tests/test_server.py
      - name: Generate tool documentation
        run: python scripts/generate_tools_docs.py
      - name: Verify generated documentation
        run: git diff --exit-code -- docs/tools.md docs/tools.json
      - name: Run tests
        run: python -m unittest discover -s tests -v

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build container
        run: docker build --tag hugo-mcp:ci .
